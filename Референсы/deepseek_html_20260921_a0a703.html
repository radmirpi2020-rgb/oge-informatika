<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#f6f5f1">
<title>ОГЭ Информатика</title>
<style>
  :root{--bg:#f6f5f1;--fg:#111;--muted:#6b6b6b;--line:#111;--accent:#ff4d00;--card:#fff;--ok:#16a34a;--err:#dc2626;--nav-h:0px}
  [data-theme="dark"]{--bg:#0d0d0d;--fg:#ececec;--muted:#8a8a8a;--line:#2e2e2e;--accent:#ff6a2b;--card:#141414}
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
  body{background:var(--bg);color:var(--fg);font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.55;transition:background .25s,color .25s;overflow-x:hidden}
  .wrap{max-width:1140px;margin:0 auto;border-left:1px solid var(--line);border-right:1px solid var(--line);min-height:100vh;display:flex;flex-direction:column;padding-bottom:var(--nav-h)}
  header{display:flex;justify-content:space-between;align-items:center;padding:14px 20px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:20}
  .logo{font-weight:700;letter-spacing:-.02em;font-size:16px}
  .logo span{color:var(--accent)}
  .toggle{border:1px solid var(--line);background:transparent;color:var(--fg);padding:8px 14px;font:inherit;font-size:13px;cursor:pointer;min-height:40px;border-radius:0}
  .toggle:active{background:var(--fg);color:var(--bg)}
  .layout{display:grid;grid-template-columns:220px 1fr;flex:1;min-height:0}
  aside{border-right:1px solid var(--line);padding:20px 0}
  aside nav{display:flex;flex-direction:column}
  aside nav button{display:block;width:100%;text-align:left;background:none;border:none;color:var(--muted);padding:12px 24px;font:inherit;font-size:14px;border-left:2px solid transparent;cursor:pointer;transition:.15s}
  aside nav button:hover{color:var(--fg)}
  aside nav button.active{color:var(--fg);border-left-color:var(--accent);background:var(--card);font-weight:600}
  main{padding:32px 28px;min-width:0}
  h1{font-size:clamp(24px,6vw,38px);line-height:1.1;letter-spacing:-.03em;margin-bottom:14px}
  h1 em{font-style:normal;color:var(--accent)}
  h2{font-size:clamp(20px,5vw,22px);letter-spacing:-.02em;margin-bottom:10px}
  h3{font-size:16px;margin:20px 0 10px}
  .kicker{font-size:11px;text-transform:uppercase;letter-spacing:.18em;color:var(--muted);margin-bottom:12px}
  .lead{font-size:15px;color:var(--muted);max-width:660px;margin-bottom:20px}
  p{margin-bottom:12px;font-size:15px}
  .cta,.btn{display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--line);background:var(--fg);color:var(--bg);padding:12px 20px;text-decoration:none;font:inherit;font-size:14px;font-weight:600;cursor:pointer;transition:.15s;min-height:44px}
  .cta:active,.btn:active{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn.ghost{background:transparent;color:var(--fg)}
  .btn.sm{padding:8px 14px;font-size:13px;min-height:38px}
  .btn.danger{border-color:var(--err);color:var(--err);background:transparent}
  .card{border:1px solid var(--line);background:var(--card);padding:18px 20px;margin-bottom:14px}
  .q{border:1px solid var(--line);padding:18px 20px;margin-bottom:12px;background:var(--card)}
  .q p.qt{font-weight:600;margin-bottom:14px;font-size:15px}
  .opts{display:grid;gap:8px}
  .opt{display:flex;gap:10px;align-items:center;border:1px solid var(--line);padding:12px 14px;font-size:15px;cursor:pointer;transition:.12s;min-height:48px}
  .opt:active{background:var(--bg)}
  .opt input{accent-color:var(--accent);width:20px;height:20px;flex-shrink:0}
  .opt.correct{border-color:var(--ok);background:rgba(22,163,74,.08)}
  .opt.wrong{border-color:var(--err);background:rgba(220,38,38,.08)}
  .result{display:none;border:1px solid var(--line);border-left:4px solid var(--accent);padding:16px 18px;margin-top:18px;background:var(--card);font-size:15px}
  .result.show{display:block}
  .hack{border-left:3px solid var(--accent);padding:10px 14px;margin:14px 0;background:var(--card);font-size:14px}
  .hack b{color:var(--accent)}
  .warn{border-left:3px solid var(--err);padding:10px 14px;margin:14px 0;background:var(--card);font-size:14px}
  .warn b{color:var(--err)}
  .ex{border:1px dashed var(--line);padding:12px 14px;font-family:ui-monospace,monospace;font-size:13px;margin:12px 0;white-space:pre-wrap;line-height:1.6;background:var(--bg);overflow-x:auto;-webkit-overflow-scrolling:touch}
  code{font-family:ui-monospace,monospace;background:var(--bg);border:1px solid var(--line);padding:1px 6px;font-size:13px;word-break:break-word}
  .lesson-card{border:1px solid var(--line);background:var(--card);padding:16px 18px;margin-bottom:10px;cursor:pointer;transition:.15s;position:relative;display:flex;align-items:center;gap:14px;min-height:72px}
  .lesson-card:active{border-color:var(--accent);background:var(--bg)}
  .lesson-card .num{font-family:ui-monospace,monospace;font-size:20px;color:var(--muted);min-width:36px;font-weight:700}
  .lesson-card .meta{flex:1;min-width:0}
  .lesson-card h3{margin:0 0 4px;font-size:15px}
  .lesson-card .sub{color:var(--muted);font-size:13px;margin:0}
  .lesson-card .status{font-size:11px;color:var(--muted);border:1px solid var(--line);padding:3px 8px;white-space:nowrap;flex-shrink:0}
  .lesson-card .status.done{color:var(--ok);border-color:var(--ok)}
  .lesson-card .status.partial{color:var(--accent);border-color:var(--accent)}
  .lesson-card.practice{border-left:4px solid var(--accent)}
  .lesson-card .practical-tag{font-size:10px;background:var(--accent);color:#fff;padding:2px 6px;margin-left:6px;letter-spacing:.08em}
  .task{border:1px solid var(--line);background:var(--card);padding:16px 18px;margin-bottom:12px}
  .task .label{font-size:11px;text-transform:uppercase;letter-spacing:.18em;color:var(--muted);margin-bottom:8px}
  .task .qt{font-weight:600;margin-bottom:12px;font-size:15px}
  .task input[type="text"]{width:100%;border:1px solid var(--line);background:var(--bg);color:var(--fg);padding:12px 14px;font:inherit;font-size:16px;margin-bottom:10px;font-family:ui-monospace,monospace;min-height:48px}
  .task input[type="text"]:focus{outline:none;border-color:var(--accent)}
  .task .feedback{margin-top:10px;font-size:14px;display:none;font-weight:600}
  .task .feedback.show{display:block}
  .task .feedback.ok{color:var(--ok)}
  .task .feedback.err{color:var(--err)}
  .task .explain{margin-top:10px;padding:10px 14px;background:var(--bg);border-left:3px solid var(--accent);font-size:14px;display:none}
  .task .explain.show{display:block}
  .practical{border:2px solid var(--accent);background:var(--card);padding:20px 22px;margin:24px 0 8px}
  .practical-head{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
  .practical-badge{background:var(--accent);color:#fff;font-size:11px;font-weight:700;padding:3px 10px;letter-spacing:.12em;text-transform:uppercase}
  .practical-head h3{margin:0;font-size:17px}
  .practical-intro{font-size:14px;color:var(--muted);margin-bottom:14px}
  .practical-task{border:1px solid var(--line);background:var(--bg);padding:14px 16px;margin-bottom:14px;font-size:15px}
  .practical-task b{display:block;margin-bottom:6px;font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
  .practical details{border:1px solid var(--line);background:var(--bg);margin-bottom:8px}
  .practical details summary{list-style:none;cursor:pointer;padding:12px 16px;font-size:14px;font-weight:600;user-select:none}
  .practical details summary::-webkit-details-marker{display:none}
  .practical details summary::before{content:"▸ ";color:var(--accent)}
  .practical details[open] summary::before{content:"▾ "}
  .practical details .inner{padding:0 16px 14px;font-size:14px}
  .practical details .inner ol{padding-left:22px}
  .practical details .inner li{margin-bottom:6px}
  .progress-row{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);font-size:14px;gap:12px}
  .progress-row:last-child{border-bottom:none}
  .progress-row>span:first-child{min-width:0;word-break:break-word}
  .progress-row .val{font-family:ui-monospace,monospace;font-weight:600;white-space:nowrap}
  .big-stat{font-size:42px;font-weight:700;letter-spacing:-.03em;font-family:ui-monospace,monospace;line-height:1}
  .big-stat span{font-size:20px;color:var(--muted)}
  footer{padding:22px 20px;border-top:1px solid var(--line);font-size:12px;color:var(--muted);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
  .back{display:inline-flex;align-items:center;gap:6px;background:none;border:none;color:var(--muted);font:inherit;font-size:14px;margin-bottom:18px;cursor:pointer;padding:8px 0;min-height:40px}
  .back:active{color:var(--accent)}
  .row{display:flex;gap:10px;flex-wrap:wrap}
  .row .btn,.row .cta{flex:1 1 auto}
  .field{margin-bottom:14px}
  .field label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px;font-weight:600}
  .field input[type="text"],.field input[type="password"],.field input[type="number"],.field textarea,.field select{width:100%;border:1px solid var(--line);background:var(--bg);color:var(--fg);padding:12px 14px;font:inherit;font-size:16px;min-height:48px;border-radius:0}
  .field textarea{font-size:15px;line-height:1.55;min-height:220px;resize:vertical;font-family:ui-monospace,monospace}
  .field input:focus,.field textarea:focus,.field select:focus{outline:none;border-color:var(--accent)}
  .field .hint{font-size:12px;color:var(--muted);margin-top:6px}
  .md-toolbar{display:flex;flex-wrap:wrap;gap:4px;padding:6px;border:1px solid var(--line);border-bottom:none;background:var(--card);position:sticky;top:57px;z-index:5}
  .md-toolbar+textarea{border-top:none}
  .md-btn{border:1px solid var(--line);background:transparent;color:var(--fg);padding:0 10px;font:inherit;font-size:13px;cursor:pointer;min-height:36px;min-width:36px;border-radius:0;display:inline-flex;align-items:center;justify-content:center;gap:4px;user-select:none}
  .md-btn:active{background:var(--accent);border-color:var(--accent);color:#fff}
  .md-btn b{font-weight:800;font-size:15px}
  .md-btn i{font-style:italic;font-size:15px;font-weight:600}
  .md-btn .mono{font-family:ui-monospace,monospace;font-weight:700;font-size:13px}
  .md-sep{width:1px;background:var(--line);margin:4px 4px;align-self:stretch}
  .theory-preview-wrap{margin-top:12px;border:1px solid var(--line);background:var(--card)}
  .theory-preview-wrap>summary{list-style:none;cursor:pointer;padding:10px 14px;font-size:13px;font-weight:600;color:var(--muted);user-select:none}
  .theory-preview-wrap>summary::-webkit-details-marker{display:none}
  .theory-preview-wrap>summary::before{content:"▸ ";display:inline-block}
  .theory-preview-wrap[open]>summary::before{content:"▾ "}
  .theory-preview{padding:16px 18px;border-top:1px solid var(--line);font-size:15px}
  .admin-lesson-row{display:flex;align-items:center;gap:10px;padding:12px 14px;border:1px solid var(--line);background:var(--card);margin-bottom:8px}
  .admin-lesson-row.practice{border-left:4px solid var(--accent)}
  .admin-lesson-row .num{font-family:ui-monospace,monospace;font-weight:700;color:var(--muted);min-width:30px;font-size:15px}
  .admin-lesson-row .info{flex:1;min-width:0}
  .admin-lesson-row .info h4{font-size:14px;margin:0 0 2px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .admin-lesson-row .info .sub{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .admin-lesson-row .tools{display:flex;gap:4px;flex-shrink:0}
  .tool-btn{width:36px;height:36px;border:1px solid var(--line);background:transparent;color:var(--fg);cursor:pointer;font-size:15px;border-radius:0;display:inline-flex;align-items:center;justify-content:center;padding:0}
  .tool-btn:active{background:var(--fg);color:var(--bg)}
  .tool-btn.danger{color:var(--err);border-color:var(--err)}
  .tool-btn:disabled{opacity:.3;cursor:default}
  .task-editor{border:1px solid var(--line);background:var(--card);padding:16px 18px;margin-bottom:12px}
  .task-editor-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
  .task-editor-head b{font-size:15px}
  .task-editor-tools{display:flex;gap:4px}
  .opt-row{display:flex;gap:8px;align-items:center;margin-bottom:8px}
  .opt-row .opt-radio{width:22px;height:22px;flex-shrink:0;accent-color:var(--accent);cursor:pointer}
  .opt-row .opt-text{flex:1;min-width:0;border:1px solid var(--line);background:var(--bg);color:var(--fg);padding:10px 12px;font:inherit;font-size:15px;min-height:44px}
  .opt-row .opt-remove{flex-shrink:0;width:40px;height:44px;border:1px solid var(--err);background:transparent;color:var(--err);cursor:pointer;font-size:18px;border-radius:0;padding:0}
  .opt-row.correct .opt-text{border-color:var(--ok)}
  .editor-actions{display:flex;gap:10px;margin-top:24px;flex-wrap:wrap}
  .editor-actions .btn{flex:1 1 auto}
  .alert{padding:12px 16px;border-left:3px solid var(--accent);background:var(--card);margin-bottom:14px;font-size:14px}
  .alert.ok{border-left-color:var(--ok);color:var(--ok)}
  .alert.err{border-left-color:var(--err);color:var(--err)}
  .stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:22px}
  .stat-box{border:1px solid var(--line);background:var(--card);padding:14px}
  .stat-box .n{font-family:ui-monospace,monospace;font-size:24px;font-weight:700;line-height:1;margin-bottom:6px}
  .stat-box .l{font-size:12px;color:var(--muted)}
  #error{display:none;padding:16px;border:2px solid var(--err);background:rgba(220,38,38,.1);color:var(--err);font-family:ui-monospace,monospace;font-size:12px;margin-bottom:20px;white-space:pre-wrap;word-break:break-word}
  #error.show{display:block}
  @media (max-width:900px){
    :root{--nav-h:68px}
    .wrap{border-left:none;border-right:none}
    aside{position:fixed;bottom:0;left:0;right:0;border-right:none;border-top:1px solid var(--line);padding:0;background:var(--bg);z-index:30;padding-bottom:env(safe-area-inset-bottom,0)}
    aside nav{flex-direction:row;justify-content:space-around;overflow-x:auto;padding:0;scrollbar-width:none}
    aside nav::-webkit-scrollbar{display:none}
    aside nav button{flex:1 1 0;min-width:60px;text-align:center;padding:10px 6px 8px;font-size:11px;line-height:1.2;border-left:none;border-top:2px solid transparent;min-height:60px;display:flex;align-items:center;justify-content:center}
    aside nav button.active{border-left:none;border-top-color:var(--accent);background:transparent;color:var(--fg)}
    .layout{grid-template-columns:1fr}
    main{padding:22px 16px 28px}
    header{padding:12px 16px}
    .logo{font-size:15px}
    .toggle{padding:6px 12px;font-size:12px;min-height:38px}
    h1{font-size:26px}
    h2{font-size:20px}
    .lesson-card{padding:14px 16px;gap:12px}
    .lesson-card .num{font-size:18px;min-width:30px}
    .lesson-card h3{font-size:14px}
    .lesson-card .sub{font-size:12px}
    .stat-grid{grid-template-columns:repeat(2,1fr);gap:8px}
    .stat-box{padding:12px}
    .stat-box .n{font-size:20px}
    .row .btn,.row .cta{flex:1 1 100%}
    footer{padding:18px 16px;font-size:11px}
    .q,.task,.card{padding:16px}
    .big-stat{font-size:36px}
    .opt{padding:13px 14px;font-size:15px}
    .admin-lesson-row{flex-wrap:wrap}
    .admin-lesson-row .tools{width:100%;justify-content:flex-end;margin-top:6px}
    .field textarea{min-height:180px}
    .md-toolbar{top:57px}
    .md-btn{padding:0 8px;min-height:34px;min-width:34px;font-size:12px}
    .practical{padding:16px 16px}
  }
  @media (max-width:380px){
    .lesson-card{flex-wrap:wrap}
    .lesson-card .status{position:absolute;top:12px;right:12px}
    .lesson-card .meta{padding-right:60px}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}html{scroll-behavior:auto}}
</style>
</head>

<div class="wrap">
  <header>
    <div class="logo">ОГЭ<span>·</span>Информатика</div>
    <button class="toggle" id="themeBtn">Тёмная</button>
  </header>
  <div class="layout">
    <aside><nav id="nav">
      <button data-nav="home">Главная</button>
      <button data-nav="test">Тест</button>
      <button data-nav="lessons">Уроки</button>
      <button data-nav="progress">Прогресс</button>
      <button data-nav="admin">Админ</button>
    </nav></aside>
    <main><div id="error"></div><div id="app"></div></main>
  </div>
  <footer><div>ОГЭ·Информатика</div><div>Локально · Без сервера</div></footer>
</div>

<script>
"use strict";

function mdEscape(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function mdInline(text){var s=mdEscape(text);s=s.replace(/`([^`]+)`/g,"<code>$1</code>");s=s.replace(/\*\*([^*]+)\*\*/g,"<b>$1</b>");s=s.replace(/(^|[^*])\*([^*\n]+)\*(?!\*)/g,"$1<i>$2</i>");return s;}
function theoryToHtml(text){
  if(!text)return "";
  if(/^\s*<(p|div|b|i|code|br|span)[\s>]/i.test(text))return text;
  var lines=String(text).split("\n"),out=[],i=0;
  while(i<lines.length){
    var line=lines[i];
    if(line.trim()==="~~~"){var buf=[];i++;while(i<lines.length&&lines[i].trim()!=="~~~"){buf.push(lines[i]);i++;}i++;out.push('<div class="ex">'+mdEscape(buf.join("\n"))+"</div>");continue;}
    if(line.indexOf("> ")===0){var hb=[];while(i<lines.length&&lines[i].indexOf("> ")===0){hb.push(lines[i].slice(2));i++;}out.push('<div class="hack">'+mdInline(hb.join(" "))+"</div>");continue;}
    if(line.indexOf("!! ")===0){var wb=[];while(i<lines.length&&lines[i].indexOf("!! ")===0){wb.push(lines[i].slice(3));i++;}out.push('<div class="warn">'+mdInline(wb.join(" "))+"</div>");continue;}
    if(line.trim()===""){i++;continue;}
    var para=[];while(i<lines.length&&lines[i].trim()!==""&&lines[i].indexOf("> ")!==0&&lines[i].indexOf("!! ")!==0&&lines[i].trim()!=="~~~"){para.push(lines[i]);i++;}
    out.push("<p>"+para.map(mdInline).join("<br>")+"</p>");
  }
  return out.join("");
}

/* ============ 25 УРОКОВ + 10 ПРАКТИК = 35 ЭЛЕМЕНТОВ ============ */

var LESSONS_DEFAULT = [
  {id:1,title:"Введение в системы счисления",sub:"Позиции, основания, цифры",
    theory:["**Система счисления** — способ записи чисел. В позиционной системе каждая цифра имеет вес, зависящий от её позиции.","","**Двоичная** (основание 2): цифры 0, 1.","**Восьмеричная** (8): цифры 0–7.","**Шестнадцатеричная** (16): цифры 0–9 и A–F (A=10, B=11, C=12, D=13, E=14, F=15).","**Десятичная** (10): цифры 0–9.","","~~~","Число 234 в десятичной:","2 в позиции 2 (сотни) = 2*100 = 200","3 в позиции 1 (десятки) = 3*10 = 30","4 в позиции 0 (единицы) = 4*1 = 4","~~~","","> **Лайфхак.** Позиция 0 — крайняя правая цифра. Считаем справа налево.","","!! **Ошибка.** Считать позиции слева направо — это даст неверный результат."].join("\n"),
    tasks:[
      {id:"l1t1",type:"input",q:"Сколько цифр в двоичной системе?",answer:"2",explain:"0 и 1."},
      {id:"l1t2",type:"input",q:"Чему равно A в шестнадцатеричной?",answer:"10",explain:"A=10."},
      {id:"l1t3",type:"input",q:"Чему равно F?",answer:"15",explain:"F=15."},
      {id:"l1t4",type:"input",q:"Позиция крайней правой цифры?",answer:"0",explain:"Позиция 0."},
      {id:"l1t5",type:"input",q:"2 в 5-й степени?",answer:"32",explain:"32."}
    ]
  },
  {id:2,title:"Перевод в десятичную систему",sub:"Умножаем цифру на вес позиции",
    theory:["**Правило.** Каждую цифру умножаем на основание в степени её позиции, складываем.","","~~~","1011 (двоичн) = 1*8 + 0*4 + 1*2 + 1*1 = 11","2F (шестнадц) = 2*16 + 15*1 = 47","34 (восьмер) = 3*8 + 4*1 = 28","~~~","","> **Лайфхак.** Степени двойки: 1, 2, 4, 8, 16, 32, 64, 128, 256, 512, 1024.","","!! **Ошибка.** Забыть, что F=15, а не 16."].join("\n"),
    tasks:[

      {id:"l2t2",type:"input",q:"10110 (двоичн) в десятичную.",answer:"22",explain:"16+4+2=22."},
      {id:"l2t3",type:"input",q:"17 (восьмер) в десятичную.",answer:"15",explain:"1*8+7=15."},
      {id:"l2t4",type:"input",q:"2A (шестнадц) в десятичную.",answer:"42",explain:"2*16+10=42."},
      {id:"l2t5",type:"input",q:"11111111 (двоичн) в десятичную.",answer:"255",explain:"2^8-1=255."}
    ]

  {id:3,title:"Перевод из десятичной и между 2-8-16",sub:"Деление и группировка бит",
    theory:["**Из десятичной.** Делим на основание, остатки выписываем снизу вверх.","","**Между 2, 8, 16.** 8=2^3, 16=2^4. Группируем биты по 3 или 4 справа.","","~~~","25 в двоичную: 25/2=12(1), 12/2=6(0), 6/2=3(0), 3/2=1(1), 1/2=0(1) -> 11001","101101 -> 101|101 = 55 (восьмер)","101101 -> 0010|1101 = 2D (шестнадц)","~~~","","> **Лайфхак.** Из двоичной в 8 или 16 не переводи через десятичную — группируй сразу.","","!! **Ошибка.** Дополнять неполную группу нулями справа. Надо слева."].join("\n"),
    tasks:[
      {id:"l3t1",type:"input",q:"25 в двоичную.",answer:"11001",explain:"Остатки снизу вверх."},
      {id:"l3t2",type:"input",q:"100 в двоичную.",answer:"1100100",explain:"64+32+4."},
      {id:"l3t3",type:"input",q:"255 в шестнадцатеричную.",answer:"FF",explain:"15*16+15."},
      {id:"l3t4",type:"input",q:"101101 в восьмеричную.",answer:"55",explain:"101|101=5|5."},
      {id:"l3t5",type:"input",q:"101101 в шестнадцатеричную.",answer:"2D",explain:"0010|1101=2|D."}
    ]

  {id:4,title:"Практика: системы счисления",sub:"Объединение уроков 1-3",practice:true,

  {id:5,title:"Логические операции",sub:"И, ИЛИ, НЕ, импликация",
    theory:["**НЕ** (¬A) — инверсия.","**И** (A ∧ B) — истинно только при обоих истинных.","**ИЛИ** (A ∨ B) — ложно только при обоих ложных.","**Импликация** (A → B) — ложна только при A=1, B=0.","","**Порядок:** НЕ, И, ИЛИ. Скобки первыми.","","~~~","A=1, B=0: A И B = 0, A ИЛИ B = 1, A → B = 0.","~~~","","> **Лайфхак.** И — умножение, ИЛИ — сложение (но 1+1=1).","","!! **Ошибка.** ИЛИ в логике включающее, а не исключающее."].join("\n"),
    tasks:[
      {id:"l5t1",type:"input",q:"A=1,B=0. A И B? (0/1)",answer:"0",explain:"И только при обоих 1."},
      {id:"l5t2",type:"input",q:"A=1,B=0. A ИЛИ B?",answer:"1",explain:"ИЛИ при любом 1."},
      {id:"l5t3",type:"input",q:"A=1,B=1. НЕ A? (0/1)",answer:"0",explain:"НЕ 1 = 0."},
      {id:"l5t4",type:"input",q:"A=1,B=1. A → B?",answer:"1",explain:"Ложна только 1→0."},
      {id:"l5t5",type:"choice",q:"Порядок без скобок?",options:["И, НЕ, ИЛИ","НЕ, И, ИЛИ","ИЛИ, И, НЕ","НЕ, ИЛИ, И"],answer:1,explain:"НЕ, И, ИЛИ."}
    ]
  },
  {id:6,title:"Таблицы истинности и де Морган",sub:"Упрощения и законы",
    theory:["**Таблица истинности:** для n переменных 2^n строк.","","**Законы де Моргана:**","~~~","НЕ(A И B) = НЕ A ИЛИ НЕ B","НЕ(A ИЛИ B) = НЕ A И НЕ B","~~~","","**Упрощения:**","~~~","A И A = A","A И НЕ A = 0","A ИЛИ НЕ A = 1","~~~","","> **Лайфхак.** Переменных больше 3 — не рисуй таблицу, подставь значения.","","!! **Ошибка.** НЕ(A И B) ≠ НЕ A И НЕ B."].join("\n"),
    tasks:[
      {id:"l6t1",type:"input",q:"Сколько строк для 3 переменных?",answer:"8",explain:"2^3=8."},
      {id:"l6t2",type:"input",q:"Сколько строк для 4 переменных?",answer:"16",explain:"16."},
      {id:"l6t3",type:"choice",q:"НЕ(A ИЛИ B)?",options:["НЕ A ИЛИ НЕ B","НЕ A И НЕ B","A И B","A ИЛИ B"],answer:1,explain:"Де Морган."},
      {id:"l6t4",type:"input",q:"A И НЕ A? (0/1/A)",answer:"0",explain:"Противоречие."},
      {id:"l6t5",type:"input",q:"A ИЛИ НЕ A? (0/1/A)",answer:"1",explain:"Всегда истинно."}
    ]
  },

  {id:8,title:"Алгоритмы и исполнители",sub:"Чертёжник, Кузнечик, Черепашка",
    theory:["**Алгоритм** — последовательность команд для исполнителя.","","**Чертёжник:** «сместиться на (a,b)» — x=x+a, y=y+b.","**Кузнечик:** «вперёд n» — x=x+n, «назад n» — x=x-n.","**Черепашка:** движение с поворотами.","","~~~","Кузнечик в 0. Повтори 3 раза [вперёд 2, назад 1]","Шаг 1: 0→2→1","Шаг 2: 1→3→2","Шаг 3: 2→4→3","~~~","","> **Лайфхак.** Цикл больше 5 раз — найди смещение за цикл и умножь.","","!! **Ошибка.** «Вперёд 2» — прибавить 2, а не перейти в точку 2."].join("\n"),
    tasks:[

      {id:"l8t3",type:"input",q:"Чертёжник (0,0). (2,3), (-1,2). X?",answer:"1",explain:"0+2-1=1."},
      {id:"l8t4",type:"input",q:"Перо опущено, 4 отрезка. Линий?",answer:"4",explain:"4."},
      {id:"l8t5",type:"input",q:"Перо поднято, 5 отрезков. Линий?",answer:"0",explain:"0."}
    ]
  },
  {id:9,title:"Циклы и условия",sub:"Повтори, пока, если",
    theory:["**Цикл «повтори N раз»** — выполнить блок N раз.","**Цикл «пока условие»** — выполнять, пока истинно.","**Условие «если»** — выполнить блок при истине.","**Условие «если-иначе»** — выбор ветви.","","~~~","Пока x < 5: x = x + 2","x=0 → 2 → 4 → 6. Цикл завершён.","~~~","","> **Лайфхак.** Маленький цикл — по шагам. Большой — ищи закономерность.","","!! **Ошибка.** Забыть про последнюю итерацию."].join("\n"),

      {id:"l9t5",type:"input",q:"Кузнечик в 0. Повтори 6 раз [+4,-2]. Где?",answer:"12",explain:"+2*6=12."}
    ]
  },
  {id:10,title:"Вспомогательные алгоритмы",sub:"Процедуры и функции",
    theory:["**Вспомогательный алгоритм** — отдельная процедура с именем.","","Позволяет не дублировать код и упрощает большие программы.","","~~~","Процедура Квадрат:","  повтори 4 раза [вперёд 10, направо 90]","","Вызов: Квадрат, сместиться, Квадрат.","~~~","","> **Лайфхак.** Повторяющийся блок команд — обычно это процедура.","","!! **Ошибка.** Считать, что процедура выполняется один раз."].join("\n"),

/* ============ ФОРМАТИРОВАНИЕ ============ */

function wrapSelection(ta,before,after,placeholder){
  var start=ta.selectionStart,end=ta.selectionEnd,value=ta.value;
  var selected=value.slice(start,end);
  var text=selected||placeholder||"";
  var replacement=before+text+after;
  ta.value=value.slice(0,start)+replacement+value.slice(end);
  if(selected){ta.selectionStart=start+before.length;ta.selectionEnd=start+before.length+text.length;}
  else{var pos=start+before.length+text.length;ta.selectionStart=ta.selectionEnd=pos;}
  ta.focus();
}
function prefixLines(ta,prefix){
  var start=ta.selectionStart,end=ta.selectionEnd,value=ta.value;
  var lineStart=value.lastIndexOf("\n",start-1)+1;
  var lineEnd=value.indexOf("\n",end);
  if(lineEnd===-1)lineEnd=value.length;
  var block=value.slice(lineStart,lineEnd);
  var lines=block.split("\n");
  var allPrefixed=lines.every(function(l){return l.indexOf(prefix)===0;});
  var newLines=lines.map(function(line){
    if(allPrefixed)return line.slice(prefix.length);
    if(line.indexOf(prefix)===0)return line;
    return prefix+line;
  });
  var newBlock=newLines.join("\n");
  ta.value=value.slice(0,lineStart)+newBlock+value.slice(lineEnd);
  ta.selectionStart=lineStart;ta.selectionEnd=lineStart+newBlock.length;
  ta.focus();
}
function wrapCodeBlock(ta){
  var start=ta.selectionStart,end=ta.selectionEnd,value=ta.value;
  var selected=value.slice(start,end);
  var text=selected||"пример";
  var replacement="~~~\n"+text+"\n~~~";
  ta.value=value.slice(0,start)+replacement+value.slice(end);
  ta.selectionStart=start+4;ta.selectionEnd=start+4+text.length;ta.focus();
}
function applyMdAction(ta,action){
  if(action==="bold")wrapSelection(ta,"**","**","жирный");
  else if(action==="italic")wrapSelection(ta,"*","*","курсив");
  else if(action==="code")wrapSelection(ta,"`","`","код");
  else if(action==="hack")prefixLines(ta,"> ");
  else if(action==="warn")prefixLines(ta,"!! ");
  else if(action==="codeblock")wrapCodeBlock(ta);
  ta.dispatchEvent(new Event("input",{bubbles:true}));
}

  html+='<div class="task-editor-head"><b>Задача '+(i+1)+'</b><div class="task-editor-tools">';
  html+='<button class="tool-btn" data-task-up="'+i+'"'+(i===0?' disabled':'')+'>↑</button>';
  html+='<button class="tool-btn" data-task-down="'+i+'"'+(i===draft.tasks.length-1?' disabled':'')+'>↓</button>';
  html+='<button class="tool-btn danger" data-task-remove="'+i+'">✕</button></div></div>';
  html+='<div class="field"><label>Тип</label><select data-task-field="type" data-task-index="'+i+'"><option value="input"'+(isChoice?'':' selected')+'>Ввод</option><option value="choice"'+(isChoice?' selected':'')+'>Выбор</option></select></div>';
  html+='<div class="field"><label>Вопрос</label><input type="text" data-task-field="q" data-task-index="'+i+'" value="'+esc(t.q)+'"></div>';
  if(!isChoice){
    html+='<div class="field"><label>Ответ</label><input type="text" data-task-field="answer" data-task-index="'+i+'" value="'+esc(t.answer)+'"></div>';
  }else{
    html+='<div class="field"><label>Варианты</label><div>';
    var opts=t.options||[];
    for(var j=0;j<opts.length;j++){
      var isCorrect=Number(t.answer)===j;
      html+='<div class="opt-row'+(isCorrect?' correct':'')+'">'+
        '<input type="radio" class="opt-radio" name="correct-'+i+'" data-opt-correct="'+i+'" data-opt-index="'+j+'"'+(isCorrect?' checked':'')+'>'+
        '<input type="text" class="opt-text" data-opt-text="'+i+'" data-opt-index="'+j+'" value="'+esc(opts[j])+'">'+
        '<button class="opt-remove" data-opt-remove="'+i+'" data-opt-index="'+j+'">✕</button></div>';
    }
    html+='</div><button class="btn sm ghost" data-opt-add="'+i+'">+ Вариант</button></div>';
  }
  html+='<div class="field"><label>Разбор</label><textarea data-task-field="explain" data-task-index="'+i+'" style="min-height:80px;font-family:inherit;font-size:14px">'+esc(t.explain||"")+'</textarea></div></div>';
  return html;
}

function syncDraftFromDOM(){
  if(!draft)return;
  document.querySelectorAll("[data-draft-field]").forEach(function(el){
    var key=el.getAttribute("data-draft-field");
    if(key==="id"){var n=parseInt(el.value,10);draft.id=isNaN(n)?0:n;}
    else{draft[key]=el.value;}
  });
  var pTitle=document.querySelector('[data-practical-field="title"]');
  var pIntro=document.querySelector('[data-practical-field="intro"]');
  var pTask=document.querySelector('[data-practical-field="task"]');
  var pSteps=document.querySelector('[data-practical-field="steps"]');
  var pAnswer=document.querySelector('[data-practical-field="answer"]');
  if(pTitle&&pTask&&pAnswer&&(pTitle.value.trim()||pTask.value.trim())){
    draft.practical={title:pTitle.value||"Практика",intro:pIntro?pIntro.value:"",task:pTask.value,steps:pSteps?pSteps.value.split("\n").filter(function(s){return s.trim()!=="";}):[],answer:pAnswer.value};
  }else if(pTitle){delete draft.practical;}
  var chk=document.getElementById("practiceCheck");
  if(chk)draft.practice=chk.checked;
  document.querySelectorAll(".task-editor").forEach(function(taskEl){
    var idx=parseInt(taskEl.getAttribute("data-task-index"),10);
    var t=draft.tasks[idx];if(!t)return;
    var typeSel=taskEl.querySelector('[data-task-field="type"]');if(typeSel)t.type=typeSel.value;
    var qEl=taskEl.querySelector('[data-task-field="q"]');if(qEl)t.q=qEl.value;
    var ansEl=taskEl.querySelector('[data-task-field="answer"]');if(ansEl&&t.type==="input")t.answer=ansEl.value;
    var expEl=taskEl.querySelector('[data-task-field="explain"]');if(expEl)t.explain=expEl.value;
    if(t.type==="choice"){
      var newOpts=[],newCorrect=0;
      taskEl.querySelectorAll(".opt-row").forEach(function(row,k){
        var textInp=row.querySelector(".opt-text");var radio=row.querySelector(".opt-radio");
        newOpts.push(textInp?textInp.value:"");if(radio&&radio.checked)newCorrect=k;
      });
      t.options=newOpts;t.answer=newCorrect;
    }else{delete t.options;}
  });
}

function saveDraftLesson(){
  if(!draft)return;
  syncDraftFromDOM();
  if(!draft.title||!draft.title.trim()){alert("Введите название");return;}
  if(!draft.id||draft.id<1){alert("ID положительный");return;}
  for(var i=0;i<LESSONS.length;i++){if(LESSONS[i].id===draft.id&&LESSONS[i].id!==draftOriginalId){alert("ID занят");return;}}
  if(!draft.practice){
    if(!draft.tasks)draft.tasks=[];
    for(var j=0;j<draft.tasks.length;j++){
      var t=draft.tasks[j];
      if(!t.q||!t.q.trim()){alert("Задача "+(j+1)+": нет вопроса");return;}
      if(t.type==="input"){if(!t.answer||!String(t.answer).trim()){alert("Задача "+(j+1)+": нет ответа");return;}}
      else if(t.type==="choice"){
        if(!t.options||t.options.length<2){alert("Задача "+(j+1)+": нужно 2+ варианта");return;}
        for(var k=0;k<t.options.length;k++){if(!t.options[k]||!t.options[k].trim()){alert("Задача "+(j+1)+": пустой вариант");return;}}
      }
    }
  }else{if(!draft.practical){alert("Заполните практику");return;}}
  var clean=clone(draft);
  if(clean.tasks){for(var m=0;m<clean.tasks.length;m++){var ct=clean.tasks[m];if(ct.type==="input"){delete ct.options;ct.answer=String(ct.answer);}else if(ct.type==="choice"){ct.answer=Number(ct.answer)||0;}}}
  var found=false;
  if(draftOriginalId!==null){for(var n=0;n<LESSONS.length;n++){if(LESSONS[n].id===draftOriginalId){LESSONS[n]=clean;found=true;break;}}}
  if(!found)LESSONS.push(clean);
  save(LS.lessons,LESSONS);draft=null;draftOriginalId=null;navigate("admin");
}

/* ============ ПРОВЕРКА ЗАДАЧ ============ */

function checkTask(t){
  var task=document.querySelector('[data-task="'+t.id+'"]');
  if(!task)return;
  var ok=false,val;
  if(t.type==="choice"){
    var checked=task.querySelector("input:checked");
    if(!checked){showFeedback(t,false,false,"Выбери вариант.");return;}
    val=parseInt(checked.value,10);ok=val===t.answer;
    var opts=task.querySelectorAll(".opt");
    for(var i=0;i<opts.length;i++)opts[i].classList.remove("correct","wrong");
    if(opts[t.answer])opts[t.answer].classList.add("correct");
    if(!ok)checked.parentElement.classList.add("wrong");
  }else{
    var input=task.querySelector('input[type="text"]');
    val=input.value;
    if(!val.trim()){showFeedback(t,false,false,"Введи ответ.");return;}
    ok=normalize(val)===normalize(t.answer);
    input.style.borderColor=ok?"var(--ok)":"var(--err)";
  }
  state.answers[t.id]={ok:ok,val:val};save(LS.answers,state.answers);
  showFeedback(t,ok,true);
  var lessonId=null;
  for(var li=0;li<LESSONS.length;li++){for(var ti=0;ti<LESSONS[li].tasks.length;ti++){if(LESSONS[li].tasks[ti].id===t.id){lessonId=LESSONS[li].id;break;}}if(lessonId!==null)break;}
  if(lessonId!==null)updateLessonDone(lessonId);
}

function showFeedback(t,ok,show,msg){
  var fb=document.getElementById("fb-"+t.id);
  var ex=document.getElementById("ex-"+t.id);
  if(!fb)return;
  if(!show){fb.textContent=msg||"";fb.className="feedback show err";return;}
  fb.textContent=ok?"✓ Верно":"✗ Неверно. Посмотри разбор.";
  fb.className="feedback show "+(ok?"ok":"err");
  if(t.explain&&ex){ex.innerHTML="<b>Разбор:</b> "+t.explain;ex.classList.add("show");}
}

function updateLessonDone(lessonId){
  var l=findLesson(lessonId);
  if(!l||!l.tasks||l.tasks.length===0)return;
  var allOk=true;
  for(var j=0;j<l.tasks.length;j++){var a=state.answers[l.tasks[j].id];if(!a||!a.ok){allOk=false;break;}}
  var box=document.getElementById("lessonDone");
  if(allOk){
    if(!state.completed[lessonId]){state.completed[lessonId]=true;save(LS.completed,state.completed);}
    if(box)box.innerHTML='<div class="card" style="border-left:4px solid var(--ok)"><b>✓ Урок пройден.</b><br><br><button class="cta" data-goto="lessons">К урокам</button></div>';
    if(box)bindGoto(box);
  }else if(box)box.innerHTML="";
}

function bindTest(){
  var form=document.getElementById("quiz");
  var result=document.getElementById("result");
  if(form){
    form.addEventListener("submit",function(e){
      e.preventDefault();
      var score=0,answered=0;
      var qs=document.querySelectorAll(".q");
      for(var i=0;i<qs.length;i++){
        var q=qs[i];
        var correct=parseInt(q.getAttribute("data-a"),10);
        var opts=q.querySelectorAll(".opt");
        var checked=q.querySelector("input:checked");
        for(var k=0;k<opts.length;k++)opts[k].classList.remove("correct","wrong");
        if(checked){
          answered++;var val=parseInt(checked.value,10);
          if(val===correct){score++;checked.parentElement.classList.add("correct");}
          else{checked.parentElement.classList.add("wrong");if(opts[correct])opts[correct].classList.add("correct");}
        }else{if(opts[correct])opts[correct].classList.add("correct");}
      }
      if(answered<qs.length){result.innerHTML="<b>Ответь на все.</b><br>Отвечено "+answered+" из "+qs.length+".";result.classList.add("show");return;}
      state.test={score:score,total:qs.length};save(LS.test,state.test);
      var msg="";
      if(score<=2)msg="База проседает. Начни с урока 01.";
      else if(score===3)msg="Середина. Уроки 02 и 03 — твои.";
      else if(score===4)msg="Хорошо. Один шаг до четвёрки.";
      else msg="Отлично. Нужна тренировка на скорость.";
      result.innerHTML="<b>Результат: "+score+" из "+qs.length+"</b><br>"+msg+'<br><br><button class="cta" data-goto="lessons">К урокам →</button>';
      result.classList.add("show");bindGoto(result);result.scrollIntoView({behavior:"smooth",block:"center"});
    });
  }
  var rbtn=document.getElementById("resetBtn");
  if(rbtn)rbtn.addEventListener("click",function(){document.querySelectorAll(".opt").forEach(function(o){o.classList.remove("correct","wrong");});if(result)result.classList.remove("show");});
}

function bindLesson(id){
  var l=findLesson(id);
  if(!l)return;
  for(var j=0;j<l.tasks.length;j++){
    (function(t){
      var btn=document.querySelector('[data-check="'+t.id+'"]');
      if(btn)btn.addEventListener("click",function(){checkTask(t);});
      var saved=state.answers[t.id];
      if(saved&&saved.ok)showFeedback(t,true,true);
      else if(saved&&t.type==="choice"&&saved.val!=null){
        var inp=document.querySelector('input[name="'+t.id+'"][value="'+saved.val+'"]');
        if(inp)inp.checked=true;
      }
      var input=document.querySelector('[data-task="'+t.id+'"] input[type="text"]');
      if(input&&saved)input.style.borderColor=saved.ok?"var(--ok)":"var(--err)";
    })(l.tasks[j]);
  }
  updateLessonDone(id);
  document.querySelectorAll("[data-lesson-nav]").forEach(function(b){
    b.addEventListener("click",function(){navigate("lesson",b.getAttribute("data-lesson-nav"));});
  });
}

function bindProgress(){
  var btn=document.getElementById("resetProgress");
  if(btn)btn.addEventListener("click",function(){
    if(confirm("Сбросить весь прогресс?")){
      localStorage.removeItem(LS.test);localStorage.removeItem(LS.completed);localStorage.removeItem(LS.answers);
      state={test:null,completed:{},answers:{}};render();
    }
  });
}

function bindGoto(scope){
  var root=scope||document;
  root.querySelectorAll("[data-goto]").forEach(function(el){
    el.addEventListener("click",function(){navigate(el.getAttribute("data-goto"));});
  });
}

function bindLessonCards(){
  document.querySelectorAll("[data-lesson]").forEach(function(card){
    card.addEventListener("click",function(){navigate("lesson",card.getAttribute("data-lesson"));});
  });
}

/* ============ РОУТЕР ============ */

var currentRoute="home",currentParam=null;
function navigate(route,param){currentRoute=route;currentParam=param||null;render();}

function render(){
  var app=document.getElementById("app");
  var errBox=document.getElementById("error");
  errBox.classList.remove("show");
  try{
    if(currentRoute==="home")app.innerHTML=viewHome();
    else if(currentRoute==="test"){app.innerHTML=viewTest();bindTest();}
    else if(currentRoute==="lessons"){app.innerHTML=viewLessons();bindLessonCards();}
    else if(currentRoute==="lesson"){var id=parseInt(currentParam,10);app.innerHTML=viewLesson(id);bindLesson(id);}
    else if(currentRoute==="progress"){app.innerHTML=viewProgress();bindProgress();}
    else if(currentRoute==="admin"){app.innerHTML=viewAdmin();bindAdmin();}
    else if(currentRoute==="lesson-edit"){app.innerHTML=viewLessonEditor();bindLessonEditor();}
    else app.innerHTML=viewHome();
    bindGoto(app);
  }catch(e){
    errBox.textContent="Ошибка: "+e.message+"\n"+(e.stack||"");
    errBox.classList.add("show");
    if(window.console)console.error(e);
  }
  var navBtns=document.querySelectorAll("[data-nav]");
  for(var i=0;i<navBtns.length;i++){
    var r=navBtns[i].getAttribute("data-nav");
    var active=(r===currentRoute)||(r==="lessons"&&currentRoute==="lesson")||(r==="admin"&&currentRoute==="lesson-edit");
    navBtns[i].classList.toggle("active",active);
  }
  window.scrollTo(0,0);
}

/* ============ ТЕМА ============ */

function initTheme(){
  var btn=document.getElementById("themeBtn");
  var saved="light";
  try{saved=localStorage.getItem("theme")||"light";}catch(e){}
  document.documentElement.setAttribute("data-theme",saved);
  btn.textContent=saved==="dark"?"Светлая":"Тёмная";
  btn.addEventListener("click",function(){
    var cur=document.documentElement.getAttribute("data-theme");
    var next=cur==="dark"?"light":"dark";
    document.documentElement.setAttribute("data-theme",next);
    try{localStorage.setItem("theme",next);}catch(e){}
    btn.textContent=next==="dark"?"Светлая":"Тёмная";
    var meta=document.querySelector('meta[name="theme-color"]');
    if(meta)meta.setAttribute("content",next==="dark"?"#0d0d0d":"#f6f5f1");
  });
  var meta=document.querySelector('meta[name="theme-color"]');
  if(meta)meta.setAttribute("content",saved==="dark"?"#0d0d0d":"#f6f5f1");
}

initTheme();
document.querySelectorAll("[data-nav]").forEach(function(btn){
  btn.addEventListener("click",function(){navigate(btn.getAttribute("data-nav"));});
});
render();
</script>
</body>
</html>
